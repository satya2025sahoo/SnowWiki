# docker-compose.yml
# ===================
# SnowWiki Enterprise Stack — Self-hosted Qdrant & Redis
#
# Usage:
#   docker compose up -d
#
# Services:
#   - Qdrant: Vector search engine (Dense + BM25 Sparse, ports 6333 REST, 6334 gRPC)
#   - Redis: Ingestion task broker & cache (port 6379)
#
# Default (no Docker):
#   - Vector DB: QDRANT_MODE=embedded (data/qdrant_storage/)
#   - Task Queue: SQLite WAL (data/ingestion_jobs.db)

version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1        # pinned version for reproducibility
    container_name: snowwiki-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"                      # REST API
      - "6334:6334"                      # gRPC API (preferred for Python client)
    volumes:
      - ./data/qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: snowwiki-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
