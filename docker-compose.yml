# docker-compose.yml
# ===================
# SnowWiki — Self-hosted Qdrant vector database
#
# Usage:
#   docker compose up -d qdrant
#
# Once running, set in .env:
#   QDRANT_MODE=grpc
#   QDRANT_HOST=localhost
#   QDRANT_GRPC_PORT=6334
#
# Default (no Docker): QDRANT_MODE=embedded  — stores data at data/qdrant_storage/

version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1        # pinned version for reproducibility
    container_name: snowwiki-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"                      # REST API
      - "6334:6334"                      # gRPC API (preferred for Python client)
    volumes:
      - ./data/qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
